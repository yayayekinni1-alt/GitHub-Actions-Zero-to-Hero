name: End-to-End CI/CD — Java / Maven / SonarQube / K8s

on:
  push:
    branches:
      - main
  pull_request:  # Optional: run analysis on PRs too

env:
  JAVA_VERSION: '17'  # LTS — recommended over 12 (EOL)
  KUBECONFIG: ${{ secrets.KUBECONFIG }}
  SONAR_TOKEN: ${{ secrets.SONAR_TKN }}

jobs:
  build-and-analyse:
    name: Build, Test & SonarQube Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # v4 — latest, maintained
        with:
          fetch-depth: 0  # Required for full Sonar blame/history

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'  # Eclipse Temurin — official, free LTS
          cache: 'maven'  # Caches ~/.m2 — drastically speeds up runs

      - name: Build & Test with Maven
        run: mvn clean verify --batch-mode

      - name: SonarQube Cloud Analysis
        uses: sonarsource/sonarcloud-github-action@v3  # v3 — current stable
        with:
          organization: <your-sonar-organisation>
          projectKey: <your-project-key>
          projectName: <your-project-name>
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}

  deploy-to-k8s:
    name: Deploy to Kubernetes
    needs: build-and-analyse
    runs-on: ubuntu-latest
    environment: production  # Optional: protect with approvals
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy manifests to Kubernetes
        uses: stefanzweifel/k8s-action@v2.0.0
        with:
          args: apply -f kubernetes/
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}
